<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b1c"><title>Roberto's Hose Route</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
html,body,#map{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#map{background:#ddd}.panel{position:absolute;z-index:1000;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;background:#ffffffed;border-radius:16px;padding:12px;box-shadow:0 4px 20px #0004;max-width:520px}.title{font-weight:800;font-size:18px;color:#173b1c}.sub{font-size:12px;color:#555;margin:4px 0 10px}.row{display:flex;gap:7px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:10px 12px;font-weight:700;background:#eee;color:#111}button.primary{background:#2d6b34;color:#fff}button.active{outline:3px solid #f0c400}#status{font-size:12px;margin-top:8px;color:#333}.legend{position:absolute;z-index:900;bottom:max(18px,env(safe-area-inset-bottom));left:12px;background:#fffE;border-radius:12px;padding:8px 10px;font-size:12px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}.pig{background:#e22}.dest{background:#1769ff}.obs{background:#ff9800}.route{background:#00a84f}
</style></head><body><div id="map"></div><div class="panel"><div class="title">Roberto's Hose Route</div><div class="sub">Marca el PIG y el punto al que quieres tirar la manguera. La app carga obstáculos cartografiados y busca una ruta que los evite.</div><div class="row"><button id="loc" class="primary">📍 Mi ubicación</button><button id="pig">🔴 PIG</button><button id="dest">🔵 Destino</button><button id="detect">🚧 Detectar obstáculos</button><button id="route" class="primary">🧵 Calcular ruta</button><button id="clear">↺ Limpiar</button></div><div id="status">Listo.</div></div><div class="legend"><span class="dot pig"></span>PIG &nbsp; <span class="dot dest"></span>Destino &nbsp; <span class="dot obs"></span>Obstáculo &nbsp; <span class="dot route"></span>Manguera</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map',{zoomControl:false}).setView([42.84,-88.95],14);L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
let mode=null,pig=null,dest=null,routeLine=null,obstacleLayers=[],obstacles=[];const s=t=>document.getElementById('status').textContent=t;
function activate(id,m){mode=m;document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.getElementById(id).classList.add('active');s(m==='pig'?'Toca el mapa donde está el PIG/Riser.':'Toca el mapa donde quieres llegar con la manguera.');}
document.getElementById('pig').onclick=()=>activate('pig','pig');document.getElementById('dest').onclick=()=>activate('dest','dest');
map.on('click',e=>{if(!mode)return;if(mode==='pig'){if(pig)map.removeLayer(pig);pig=L.circleMarker(e.latlng,{radius:9,color:'#fff',weight:3,fillColor:'#e22',fillOpacity:1}).addTo(map).bindTooltip('PIG',{permanent:true,direction:'top'});}else{if(dest)map.removeLayer(dest);dest=L.circleMarker(e.latlng,{radius:9,color:'#fff',weight:3,fillColor:'#1769ff',fillOpacity:1}).addTo(map).bindTooltip('Destino',{permanent:true,direction:'top'});}mode=null;document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));});
document.getElementById('loc').onclick=()=>{s('Buscando GPS…');map.locate({setView:true,maxZoom:17,enableHighAccuracy:true});};map.on('locationfound',e=>{L.circleMarker(e.latlng,{radius:6,fillColor:'#111',fillOpacity:1,color:'#fff'}).addTo(map);s('Ubicación encontrada. Ahora marca PIG y destino.');});map.on('locationerror',()=>s('No pude obtener GPS. Revisa el permiso de ubicación de Safari.'));
function clearObs(){obstacleLayers.forEach(x=>map.removeLayer(x));obstacleLayers=[];obstacles=[]}
function addObstacleLatLngs(latlngs,type){let p=L.polygon(latlngs,{color:'#ff9800',weight:2,fillColor:'#ff9800',fillOpacity:.25}).addTo(map);obstacleLayers.push(p);obstacles.push({latlngs,type});}
document.getElementById('detect').onclick=async()=>{clearObs();const b=map.getBounds(),q=`[out:json][timeout:20];(way[building](${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()});way[natural=water](${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()});way[waterway=riverbank](${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()});way[landuse=forest](${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()});way[natural=wood](${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()}););out geom;`;s('Detectando edificios, agua y áreas arboladas…');try{const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:q});const j=await r.json();j.elements.forEach(el=>{if(el.geometry&&el.geometry.length>2)addObstacleLatLngs(el.geometry.map(g=>[g.lat,g.lon]),'osm')});s(`Obstáculos detectados: ${obstacles.length}. Puedes calcular la ruta.`);}catch(e){s('No se pudieron descargar obstáculos. Intenta otra vez con internet.')}};
function blocked(ll){for(const o of obstacleLayers){if(o.getBounds().pad(.015).contains(ll)){let p=map.latLngToLayerPoint(ll),pts=o.getLatLngs()[0].map(x=>map.latLngToLayerPoint(x));if(pointInPoly(p,pts))return true}}return false}function pointInPoly(p,vs){let ins=false;for(let i=0,j=vs.length-1;i<vs.length;j=i++){let xi=vs[i].x,yi=vs[i].y,xj=vs[j].x,yj=vs[j].y;let inter=((yi>p.y)!=(yj>p.y))&&(p.x<(xj-xi)*(p.y-yi)/(yj-yi+1e-9)+xi);if(inter)ins=!ins}return ins}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function route(){if(!pig||!dest){s('Primero marca PIG y destino.');return}if(routeLine)map.removeLayer(routeLine);const start=map.latLngToLayerPoint(pig.getLatLng()),goal=map.latLngToLayerPoint(dest.getLatLng());let direct=L.polyline([pig.getLatLng(),dest.getLatLng()]);let samples=[];for(let i=0;i<=80;i++)samples.push(map.layerPointToLatLng(L.point(start.x+(goal.x-start.x)*i/80,start.y+(goal.y-start.y)*i/80)));if(!samples.some(blocked)){routeLine=L.polyline([pig.getLatLng(),dest.getLatLng()],{color:'#00a84f',weight:7}).addTo(map);return showLen()}
const pad=180,step=18,minx=Math.min(start.x,goal.x)-pad,maxx=Math.max(start.x,goal.x)+pad,miny=Math.min(start.y,goal.y)-pad,maxy=Math.max(start.y,goal.y)+pad;const cols=Math.ceil((maxx-minx)/step)+1,rows=Math.ceil((maxy-miny)/step)+1;const key=(x,y)=>x+','+y,cell=p=>({x:Math.round((p.x-minx)/step),y:Math.round((p.y-miny)/step)}),pt=c=>L.point(minx+c.x*step,miny+c.y*step),A=cell(start),G=cell(goal),open=[A],came=new Map(),gs=new Map([[key(A.x,A.y),0]]),closed=new Set();let found=null;while(open.length){open.sort((u,v)=>(gs.get(key(u.x,u.y))+dist(u,G))-(gs.get(key(v.x,v.y))+dist(v,G)));let c=open.shift(),ck=key(c.x,c.y);if(closed.has(ck))continue;closed.add(ck);if(dist(c,G)<1.5){found=c;break}for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){if(!dx&&!dy)continue;let n={x:c.x+dx,y:c.y+dy};if(n.x<0||n.y<0||n.x>=cols||n.y>=rows)continue;let ll=map.layerPointToLatLng(pt(n));if(blocked(ll))continue;let nk=key(n.x,n.y),ng=gs.get(ck)+Math.hypot(dx,dy);if(ng<(gs.get(nk)??1e99)){gs.set(nk,ng);came.set(nk,c);open.push(n)}}}
if(!found){s('No encontré una ruta libre. Aleja el mapa o corrige obstáculos.');return}let path=[found],c=found;while(key(c.x,c.y)!==key(A.x,A.y)){c=came.get(key(c.x,c.y));if(!c)break;path.push(c)}path.reverse();let lls=[pig.getLatLng(),...path.map(c=>map.layerPointToLatLng(pt(c))),dest.getLatLng()];routeLine=L.polyline(lls,{color:'#00a84f',weight:7,lineJoin:'round'}).addTo(map);showLen()}
function showLen(){let a=routeLine.getLatLngs(),m=0;for(let i=1;i<a.length;i++)m+=a[i-1].distanceTo(a[i]);s(`Ruta lista: ~${Math.round(m*3.28084).toLocaleString()} ft de manguera.`)}document.getElementById('route').onclick=route;
document.getElementById('clear').onclick=()=>{[pig,dest,routeLine].forEach(x=>x&&map.removeLayer(x));pig=dest=routeLine=null;clearObs();s('Limpio. Marca un nuevo PIG y destino.');};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
